<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>Location Info</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">

<script type="text/javascript" src="../js/localsite.js?display=everything&showheader=true&showsearch=true&showtopmap=true"></script>
<script type="text/javascript" src="../js/industry-detail.js?v=8"></script>
<script type="text/javascript" src="../js/impact-sets.js"></script><!-- Impact set list for the #hero-mini menu -->
<style>
.navlink-industries {
    font: 600 16px/1.8 "Lato", sans-serif !important;
    color: #222 !important;
}
.dark .navlink-industries {
    color: #fff !important;
}

/* Hero - copied from apps/index.html. #hero-landscape-image has class="dark", so the hero is dark in both modes. */
#hero_holder {
    container-type: inline-size; /* Responsive to the parent div width rather than the browser width */
}
#hero-landscape-image.bgimg {
    min-height: 600px;
    flex-direction: column;
    opacity: 1; /* Rather than the .bgimg opacity (base.css), which faded the image toward the white page and faded the elements over it */
    isolation: isolate; /* Keeps the ::before overlay behind the hero content */
}
/* Darkens only the image, matching the dark mode look of the image at .bgimg opacity over the #333 dark body */
#hero-landscape-image.bgimg::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background-color: rgba(51, 51, 51, 0.35);
    pointer-events: none;
}
/* Flex rather than the display:block !important of .displayOnload (base.css), so #heroBottom can sit at the bottom */
#hero-landscape-image.bgimg.displayOnload {
    display: flex !important;
}
/* Energy summary for set=energy. profile/js/state-energy.js moves #stateEnergyTitle, #stateEnergyIntro and #stateEnergyCards here. */
#heroBottom {
    display: none;
    margin-top: auto;
    background-color: rgba(51, 51, 51, 0.5);
}
.energyView #heroBottom {
    display: block;
}
#heroBottomEnergy {
    container-type: inline-size; /* For the .energy-cards container query */
    padding: 20px 60px 24px 60px;
}
#heroBottomEnergy .energy-cards {
    margin-top: 12px;
}
@media (max-width: 600px) {
    #heroBottomEnergy {
        padding: 16px;
    }
    #hero_holder #hero-content { /* Beats the padding: 0px in base.css */
        padding-left: 12px;
        padding-right: 12px;
    }
    #hero_holder #stateName {
        display: none;
    }
}
#hero-mini {
    max-width: 150px;
    padding: 8px 0;
    margin-bottom: 12px;
}
.heroImpactIcons div {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 15px;
    font-size: 16px;
    color: #fff;
    border-left: 3px solid transparent;
    cursor: pointer;
    min-width: 140px;
}
.heroImpactIcons .material-icons {
    font-size: 18px;
}
.heroImpactIcons div:hover, .heroImpactIcons div:focus-visible {
    background-color: rgba(255, 255, 255, 0.12);
    outline: none;
}
.heroImpactIcons div.active {
    background-color: rgba(255, 255, 255, 0.2);
    border-left-color: #66CF79; /* Matches #hero-rect links */
    font-weight: 600;
}
#heroSelectCounties {
    margin-top: 6px;
}
#stateName {
    font-size: 48px;
}
@container (max-width: 1000px) {
    #hero-mini {
        display: none;
    }
    #stateName {
        font-size: 34px;
    }
}
</style>
</head>
<body>

<div id="hero_holder" class="hideWhenGeoview">
<div id="hero-landscape-image" class="dark bgimg displayOnload" style="display:none;">

  <div id="hero-content">

    <!-- US region from hash.usregion (#usregion_select). Replaces #stateName while present. -->
    <div id="regionName" class="hero-title" style="font-size:48px; font-weight:300; display:none"></div>
    <div id="stateName" class="hero-title" style="font-weight:300">Location Modeling</div><!-- font-size in the style above -->

    <br>

    <div id="hero-mini" class="hideMobile">
      <div id="heroImpactIcons" class="heroImpactIcons" role="menu" aria-label="Impact sets"></div>
    </div>

    <div id="hero-rect" class="displayOnload" style="display: none; margin-right:30px">

      <!-- navigation.js moves #state_select here, and back here after the location filter closes -->
      <div id="relocatedStateMenu"></div>

      <div style="margin-bottom:10px; max-width:400px">
        <div class="location_titles"></div><!-- Counties within state -->
      </div>

      <!-- Shown once a state is selected -->
      <div id="heroSelectCounties" style="display:none">
        <a href="#mapview=counties" onclick="$('#filterClickLocation').click();return false;">Select counties</a> to view local industry impacts.
      </div>

      <div id="parsedOutput"></div>

    </div>

  </div>
  <div style="clear:both"></div>

  <div id="heroBottom">
    <div id="heroBottomEnergy"></div>
  </div>

</div>
</div>

<script>
(function() {
  const impactIcons = {air:'air', water:'water_drop', land:'forest', energy:'lightbulb', health:'local_pharmacy', prosperity:'sentiment_satisfied_alt'};

  // #hero-mini menu, built from the shared impact set list in impact-sets.js
  const menu = document.getElementById('heroImpactIcons');
  impactSets.forEach(function(set) {
    const item = document.createElement('div');
    item.dataset.set = set.id;
    item.setAttribute('role', 'menuitem');
    item.setAttribute('tabindex', '0');
    item.title = set.heading;
    item.innerHTML = "<span class='material-icons'>" + (impactIcons[set.id] || 'circle') + "</span><span>" + set.title + "</span>";
    menu.appendChild(item);
  });
  // Plain JavaScript: localsite.js loads jQuery after this script runs.
  menu.addEventListener('click', function(e) {
    const item = e.target.closest('[data-set]');
    if (!item) return;
    const set = item.dataset.set;
    if (typeof iNav === 'function') { // navigation.js
      iNav(set);
    } else {
      goHash({'set':set}, ['indicators']); // naics.js loads the set's indicators from hash.set
    }
  });
  menu.addEventListener('keydown', function(e) {
    const item = e.target.closest('[data-set]');
    if (item && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); item.click(); }
  });

  // States in hash.state, without "all"
  function heroStates(hash) {
    return String(hash.state || "").split(",").filter(value => value && value.toLowerCase() !== "all");
  }
  function updateHero() {
    const hash = getHash();
    const states = heroStates(hash);

    // Highlight the active #hero-mini menu item
    menu.querySelectorAll('[data-set]').forEach(function(item) {
      const isActive = item.dataset.set === String(hash.set || "").toLowerCase();
      item.classList.toggle('active', isActive);
      if (isActive) { item.setAttribute('aria-current', 'true'); } else { item.removeAttribute('aria-current'); }
    });

    document.getElementById('heroSelectCounties').style.display = states.length ? '' : 'none';

    const stateName = document.getElementById('stateName');
    // hash.usregion omits spaces (NewEngland), so a space goes back before each inner capital: New England
    const regionName = document.getElementById('regionName');
    // usRegionTitle (navigation.js) also gets the region from the states when hash.usregion is absent
    const region = typeof usRegionTitle === 'function' ? usRegionTitle(hash) : String(hash.usregion || "").replace(/([a-z])([A-Z])/g, "$1 $2");
    regionName.textContent = region ? region + " States" : ""; // As in usRegionServiceTitle() (navigation.js) for .showTopicLink
    regionName.style.display = region ? "" : "none";
    stateName.style.display = region ? "none" : "";
    if (!states.length) {
      stateName.textContent = "Location Modeling";
      return;
    }
    onElmReady('#state_select', function(select) {
      const names = states.map(st => {
        const option = select.querySelector("option[value='" + st.toUpperCase() + "']");
        return option ? option.text : "";
      }).filter(Boolean);
      stateName.textContent = names.length ? names.join(", ") : "Location Modeling";
    });
  }
  document.addEventListener('hashChangeEvent', updateHero);
  updateHero();
  onElmReady('#usregion_select', updateHero); // Once the region menu loads, the region can come from the states

  // Default hero image. navigation.js swaps in the state image when a state is selected.
  if (!heroStates(getHash()).length) {
    document.getElementById('hero-landscape-image').style.backgroundImage = "url(../img/hero/stars.jpg)";
  }
})();
</script>

</html>
