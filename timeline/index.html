<script>
loadMarkdown("README.md", "readmeDiv", "_parent");
(() => {
    let cachedLegendPosition = 'right';
    try {
        cachedLegendPosition = localStorage.getItem('legendPosition') || 'right';
    } catch (e) { /* ignore */ }
    window._cachedLegendPosition = cachedLegendPosition;
    window._timelineLegendAllowSidebar = (cachedLegendPosition === 'left');
})();
const WHICH_PER_STORAGE_KEY = 'timelineWhichPer';
function getStoredWhichPerOption() {
    try {
        const stored = localStorage.getItem(WHICH_PER_STORAGE_KEY);
        if (stored === 'totals' || stored === 'percapita' || stored === 'perarea') return stored;
    } catch (e) { /* ignore */ }
    return null;
}
// Per Capita is the default. Reports that can't be divided by population (PER_CAPITA_UNAVAILABLE_GOALS) show Totals,
// and the next report goes back to the visitor's choice, or Per Capita.
// Population per person is a flat line, though Per Capita can still be clicked there. Health hides these options.
const PER_CAPITA_UNAVAILABLE_GOALS = ['population', 'health'];
function applyStoredWhichPerOption() {
    try {
        const hash = getHash();
        if (PER_CAPITA_UNAVAILABLE_GOALS.includes(hash.goal)) return;
        const choice = getStoredWhichPerOption() || 'percapita';
        const radio = document.querySelector(`input[name="whichPer"][value="${choice}"]`);
        if (radio && !radio.checked) radio.checked = true;
    } catch (e) { /* ignore */ }
}

function applyPerCapitaGoalSettings() {
    const hash = getHash();
    const perCapitaOptions = document.getElementById('perCapitaOptions');
    if (perCapitaOptions) {
        if (hash.goal === "health") {
            perCapitaOptions.style.display = 'none';
        } else {
            perCapitaOptions.style.display = 'block';
        }
    }
    if (PER_CAPITA_UNAVAILABLE_GOALS.includes(hash.goal)) {
        // Not saved as the visitor's choice, so the next report returns to it
        const totalsRadio = document.querySelector('input[name="whichPer"][value="totals"]');
        if (totalsRadio && !totalsRadio.checked) {
            totalsRadio.checked = true;
        }
    } else {
        applyStoredWhichPerOption();
    }
}

/* Also update home/index.html */
document.addEventListener('hashChangeEvent', function (elem) {
    console.log("Timeline page detects URL hashChangeEvent");
    let hash = getHash();
    if (!hash.scope) {
        hash.scope = "country"; // CUSTOM - also set in call to localsite.js above.
    }
    // Per Capita or Totals for the new report, before anything below redraws the chart
    if (document.getElementById('perCapitaOptions')) {
        applyPerCapitaGoalSettings();
    } else {
        waitForElm('#perCapitaOptions').then(() => {
            applyPerCapitaGoalSettings();
        });
    }
    updateStateMenuVisibility(); // Top 5 in place of Top Economies for states, counties and zips, before the redraw below
    const stateChanged = setStateMenuFromHash(); // A state=XX set elsewhere, such as the header's state menu
    // Compare with the scope and goal last loaded, not priorHash, which starts with the include's scope=country
    if (hash.scope + '|' + (hash.goal || '') !== window._timelineSheetView) {
        const selectScope = document.getElementById("selectScope");
        if (selectScope) {
          selectScope.value = hash.scope;
        }
        updateDcidSelectFromSheet(hash.scope); // In localsite/js/earthscape.js
    } else if (stateChanged && String(hash.scope).toLowerCase() === 'county') {
        refreshTimeline();
    }
    if (typeof updateScopeNav === 'function' && String(hash.scope).toLowerCase() !== document.getElementById('scope-nav')?.dataset.scope) {
        updateScopeNav();
    }
    updateStateMenuVisibility();
}, false);
document.addEventListener('DOMContentLoaded', () => {
    let hash = getHash();
    if (!hash.scope) {
        hash.scope = document.getElementById('selectScope').options[document.getElementById('selectScope').selectedIndex].text;
    }
    applyPerCapitaGoalSettings();
    setStateMenuFromHash(); // state=XX in the URL, before the first chart. refreshTimeline() defaults to Georgia and writes state to the hash.
    //alert(hash.scope)
    updateStateMenuVisibility(); // Before the first chart, which reads the which-lines radio
    updateDcidSelectFromSheet(hash.scope);
    
    document.addEventListener('change', function(event) {
        if (event.target.name === 'whichLines') {
          console.log('whichLines changed to ' + event.target.value);
          refreshTimeline();
        }
    });

    document.getElementById('chartVariable').addEventListener('change', (event) => {
        if (typeof updateTimelineMinYearFromSelect === 'function') {
            updateTimelineMinYearFromSelect(event.target);
        }
        refreshTimeline();
    });

    // State menu change
    const entitySel = document.getElementById('entityId');
            if (entitySel) {
            entitySel.addEventListener('change', () => refreshTimeline());
            }
    document.querySelectorAll('input[name="whichPer"]').forEach((radio) => {
        radio.addEventListener('change', () => {
            // A choice made on Population isn't saved, so other reports keep the visitor's usual choice
            if (!PER_CAPITA_UNAVAILABLE_GOALS.includes(getHash().goal)) {
                try { localStorage.setItem(WHICH_PER_STORAGE_KEY, radio.value); } catch (e) { /* ignore */ }
            }
            refreshTimeline(); // This will re-fetch emissions and population and update the chart
        });
    });
});

function updateStateMenuVisibility() {
  const hash = getHash();
  const scope = String(hash.scope || 'country').toLowerCase();
  const entitySelect = document.getElementById('entityId');
  if (entitySelect) {
    entitySelect.style.display = (scope === 'county' || scope.indexOf('zip') >= 0) ? '' : 'none';
  }
  document.querySelectorAll('.scope-country').forEach(el => {
    el.style.display = (scope === 'country') ? '' : 'none';
  });
  // Top Economies, the default, shows for countries only. States, counties and zips switch from it to Top 5,
  // and countries switch back to it when Top 5 was chosen that way.
  const topEconomies = document.querySelector('input[name="whichLines"][value="showSelected"]');
  const top5 = document.querySelector('input[name="whichLines"][value="showTop5"]');
  if (!topEconomies || !top5) return;
  if (scope !== 'country') {
    if (topEconomies.checked) { top5.checked = true; window._top5ForScope = true; }
  } else {
    if (window._top5ForScope && top5.checked) topEconomies.checked = true;
    window._top5ForScope = false;
  }
}

<body class="timeline-loading">


<div class="heroTransparent">

<div class="content contentpadding large-list">
  <!-- Also update in home repo -->
  <div id="scope-nav" style="margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid rgba(0,0,0,0.18); font-family: Arial, sans-serif;"></div>
  <div id="timeline-nav" style="margin-bottom: 8px; font-family: Arial, sans-serif;"><!-- Links are populated here --></div>
  
  <script>
    function updateScopeNav() {
      const scopes = [
        { scope: "country", name: "International" }, // Label only, the hash keeps scope=country
        { scope: "state", name: "States" },
        { scope: "county", name: "Counties" }
      ];
      const hash = getHash();
      const currentScope = (hash.scope || "country").toLowerCase();
      const container = document.getElementById('scope-nav');
      if (!container) return;
      container.innerHTML = '';
      container.dataset.scope = currentScope; // The scope shown, compared on hashChangeEvent
      scopes.forEach((item, index) => {
        if (index > 0) container.appendChild(document.createTextNode(' | '));
        if (item.scope === currentScope) {
          const boldText = document.createElement('b');
          boldText.textContent = item.name;
          boldText.style.marginLeft = '2px';
          boldText.style.marginRight = '2px';
          container.appendChild(boldText);
        } else {
          const link = document.createElement('a');
          link.href = '#';
          link.textContent = item.name;
          link.style.marginLeft = '2px';
          link.style.marginRight = '2px';
          link.style.textDecoration = 'none';
          link.className = 'timeline-link';
          link.onclick = function(e) {
            e.preventDefault();
            goHash({ scope: item.scope });
          };
          container.appendChild(link);
        }
      });

      const zipWrap = document.createElement('span');
      zipWrap.className = 'local';
      zipWrap.style.display = 'none';
      zipWrap.appendChild(document.createTextNode(' | '));
      if (currentScope === 'zip') {
        const boldText = document.createElement('b');
        boldText.textContent = 'Zip Codes';
        boldText.style.marginLeft = '2px';
        boldText.style.marginRight = '2px';
        zipWrap.appendChild(boldText);
      } else {
        const zipLink = document.createElement('a');
        zipLink.href = '#';
        zipLink.textContent = 'Zip Codes';
        zipLink.style.marginLeft = '2px';
        zipLink.style.marginRight = '2px';
        zipLink.style.textDecoration = 'none';
        zipLink.className = 'timeline-link';
        zipLink.onclick = function(e) {
          e.preventDefault();
          goHash({ scope: 'zip' });
        };
        zipWrap.appendChild(zipLink);
      }
      container.appendChild(zipWrap);

      // Date range label — far right of the scope nav bar
      const existingRangeLabel = document.getElementById('date-range-label');
      if (existingRangeLabel) existingRangeLabel.remove();
      const rangeLabel = document.createElement('span');
      rangeLabel.id = 'date-range-label';
      rangeLabel.style.cssText = 'float:right; color:#aaa; font-size:12px; cursor:pointer; user-select:none; line-height:1.8;';
      rangeLabel.title = 'Click to change date range';
      rangeLabel.addEventListener('click', function(e) {
        e.stopPropagation();
        if (typeof openDateRangePopup === 'function') openDateRangePopup(rangeLabel);
      });
      container.appendChild(rangeLabel);
      if (typeof updateDateRangeLabel === 'function') updateDateRangeLabel();
    }

    function updateTimelineNav() {
      // Define all goals with their display names
      const goals = [
        { goal: "air", name: "Emissions" },
        { goal: "health", name: "Health" },
        { goal: "jobs", name: "Jobs" },
        { goal: "economy", name: "Economy" },
        { goal: "biodiverse", name: "Biodiversity" },
        { goal: "water", name: "Water" },
        { goal: "population", name: "Population" }
      ];
  
      // Get the current goal from the hash
      const hash = window.location.hash;
      const goalMatch = hash.match(/goal=([^&]+)/);
      const currentGoal = goalMatch ? goalMatch[1] : "air"; // Default to "air"
  
      // Find the active goal object
      const activeGoal = goals.find(g => g.goal === currentGoal) || goals[0];
      //const inactiveGoals = goals.filter(g => g.goal !== currentGoal);
  
      const allGoals = goals;

      // Clear the container
      const container = document.getElementById('timeline-nav');
      container.innerHTML = '';
  
      // Add the active goal first as "Timeline"
      const activeElement = document.createElement('span');
      activeElement.innerHTML = `<b>${activeGoal.name} Timeline</b>`;
      //container.appendChild(activeElement);
  
      // Add the goals as links
      allGoals.forEach((goal, index) => {
        // Only add separator if not the first item
        if (index > 0) {
            const separator = document.createTextNode(' | ');
            container.appendChild(separator);
        }
        
        if (goal.goal === currentGoal) {
            // Make current goal bold instead of linking it
            const boldText = document.createElement('b');
            boldText.textContent = goal.name;
            boldText.style.marginLeft = '2px';
            boldText.style.marginRight = '2px';
            container.appendChild(boldText);
        } else {
            // Create link for other goals
            const link = document.createElement('a');
            link.href = `#goal=${goal.goal}${goal.extra || ''}`;
            link.textContent = goal.name;
            link.style.marginLeft = '2px';
            link.style.marginRight = '2px';
            link.style.textDecoration = 'none';
            link.className = 'timeline-link';
            container.appendChild(link);
        }
      });
    }
  
    // Run on load and hash change
    document.addEventListener('DOMContentLoaded', updateScopeNav);
    document.addEventListener('DOMContentLoaded', updateTimelineNav);
    document.addEventListener('hashChangeEvent', function () {
      const hash = getHash();
      const shownScope = document.getElementById('scope-nav')?.dataset.scope; // Not priorHash, which starts with the include's scope=country
      const currentScope = (hash.scope || "country").toLowerCase();
      if (currentScope !== shownScope) {
        updateScopeNav();
      }
    });
    window.addEventListener('hashchange', updateTimelineNav);
  </script>

  <script>
  // ── Date range picker ──────────────────────────────────────────────────────

  function getDateRangeCacheKey(scope, dcid) {
    const s = scope || (typeof getHash === 'function' ? (getHash().scope || 'country') : 'country');
    const d = dcid  || (typeof getHash === 'function' ? (getHash().features?.dcid || '') : '');
    return d ? 'timelineDateRange_' + s + '_' + d : null;
  }

  function saveDateRange(start, end, scope, dcid) {
    try {
      const key = getDateRangeCacheKey(scope, dcid);
      if (key) localStorage.setItem(key, JSON.stringify({ start: start, end: end }));
    } catch(e) {}
  }

  function loadDateRange(scope, dcid) {
    try {
      const key = getDateRangeCacheKey(scope, dcid);
      if (!key) return null;
      const val = localStorage.getItem(key);
      if (!val) return null;
      const p = JSON.parse(val);
      if (p && typeof p.start === 'number' && typeof p.end === 'number') return p;
    } catch(e) {}
    return null;
  }

  // Called by earthscape.js via window hook before every chart refresh
  window.onBeforeRefreshTimeline = function(scope, dcid) {
    const saved = loadDateRange(scope, dcid);
    if (saved) {
      if (typeof setTimelineMinYear === 'function') setTimelineMinYear(saved.start);
      if (typeof setTimelineMaxYear === 'function') setTimelineMaxYear(saved.end);
    } else {
      // No saved preference — let updateTimelineMinYearFromSelect set MIN, reset MAX
      if (typeof setTimelineMaxYear === 'function') setTimelineMaxYear(9999);
    }
  };

  function applyDateRange(start, end) {
    if (typeof setTimelineMinYear === 'function') setTimelineMinYear(start);
    if (typeof setTimelineMaxYear === 'function') setTimelineMaxYear(end);
    const hash = typeof getHash === 'function' ? getHash() : {};
    saveDateRange(start, end, hash.scope, hash.features?.dcid);
    updateDateRangeLabel();
    if (typeof refreshTimeline === 'function') refreshTimeline();
  }

  function resetDateRange() {
    try {
      const key = getDateRangeCacheKey();
      if (key) localStorage.removeItem(key);
    } catch(e) {}
    if (typeof setTimelineMaxYear === 'function') setTimelineMaxYear(9999);
    // Let updateTimelineMinYearFromSelect restore the dataset default MIN
    const sel = document.getElementById('chartVariable');
    if (sel && typeof updateTimelineMinYearFromSelect === 'function') updateTimelineMinYearFromSelect(sel);
    updateDateRangeLabel();
    if (typeof refreshTimeline === 'function') refreshTimeline();
  }

  function updateDateRangeLabel() {
    const label = document.getElementById('date-range-label');
    if (!label) return;
    const years = window._timelineYears;
    if (!years || !years.length) { label.textContent = ''; return; }
    const dataMin = years[0];
    const dataMax = years[years.length - 1];
    const curMin = window._timelineMinYear || dataMin;
    const curMax = (window._timelineMaxYear && window._timelineMaxYear < 9999) ? window._timelineMaxYear : dataMax;
    const lo = Math.max(curMin, dataMin);
    const hi = Math.min(curMax, dataMax);
    label.textContent = lo + '–' + hi;
  }

  function openDateRangePopup(anchorEl) {
    ensureDateRangePopup();
    const popup = document.getElementById('date-range-popup');
    if (!popup) return;
    const years = window._timelineYears || [];
    const dataMin = years.length ? parseInt(years[0]) : 1960;
    const dataMax = years.length ? parseInt(years[years.length - 1]) : new Date().getFullYear();
    const curMin = window._timelineMinYear || dataMin;
    const curMax = (window._timelineMaxYear && window._timelineMaxYear < 9999) ? window._timelineMaxYear : dataMax;
    document.getElementById('date-range-start').value = Math.max(curMin, dataMin);
    document.getElementById('date-range-start').min = dataMin;
    document.getElementById('date-range-start').max = dataMax;
    document.getElementById('date-range-end').value = Math.min(curMax, dataMax);
    document.getElementById('date-range-end').min = dataMin;
    document.getElementById('date-range-end').max = dataMax;
    document.getElementById('date-range-avail').textContent = 'Available: ' + dataMin + '–' + dataMax;
    // Position below the anchor
    const rect = anchorEl.getBoundingClientRect();
    popup.style.top  = (rect.bottom + window.scrollY + 6) + 'px';
    popup.style.left = Math.max(8, rect.right + window.scrollX - 228) + 'px';
    popup.style.display = 'block';
  }

  function ensureDateRangePopup() {
    if (document.getElementById('date-range-popup')) return;
    const popup = document.createElement('div');
    popup.id = 'date-range-popup';
    popup.style.cssText = 'display:none; position:absolute; z-index:9999; background:#fff; border:1px solid #ddd; border-radius:8px; padding:16px; box-shadow:0 4px 16px rgba(0,0,0,0.14); width:228px; font-family:Arial,sans-serif;';
    popup.innerHTML =
      '<div style="font-size:13px;font-weight:600;margin-bottom:6px;color:#333;">Date Range</div>' +
      '<div id="date-range-avail" style="font-size:11px;color:#aaa;margin-bottom:10px;"></div>' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">' +
        '<input type="number" id="date-range-start" style="width:72px;padding:5px 6px;border:1px solid #ccc;border-radius:4px;font-size:13px;">' +
        '<span style="color:#888;font-size:14px;">–</span>' +
        '<input type="number" id="date-range-end" style="width:72px;padding:5px 6px;border:1px solid #ccc;border-radius:4px;font-size:13px;">' +
      '</div>' +
      '<div style="display:flex;gap:8px;">' +
        '<button id="date-range-apply" style="padding:6px 16px;background:#0066ff;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;">Apply</button>' +
        '<button id="date-range-reset" style="padding:6px 12px;background:#f0f0f0;color:#555;border:none;border-radius:4px;font-size:12px;cursor:pointer;">Reset</button>' +
      '</div>';
    document.body.appendChild(popup);

    document.getElementById('date-range-apply').addEventListener('click', function() {
      const start = parseInt(document.getElementById('date-range-start').value);
      const end   = parseInt(document.getElementById('date-range-end').value);
      if (!isNaN(start) && !isNaN(end) && start <= end) {
        popup.style.display = 'none';
        applyDateRange(start, end);
      }
    });

    document.getElementById('date-range-reset').addEventListener('click', function() {
      popup.style.display = 'none';
      resetDateRange();
    });

    // Close on outside click
    document.addEventListener('click', function(e) {
      if (popup.style.display === 'none') return;
      if (!popup.contains(e.target) && e.target.id !== 'date-range-label') {
        popup.style.display = 'none';
      }
    }, true);
  }
